name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.toolchain.name }} ${{ matrix.preset }}
    runs-on: ${{ matrix.toolchain.os }}
    strategy:
      # Never cancel the other platforms just because one failed: the point of
      # this matrix is to see every platform's result on a single run.
      fail-fast: false
      matrix:
        preset: [release, debug]
        toolchain:
          - id: windows-msvc
            name: Windows MSVC
            os: windows-latest
            c: cl
            cxx: cl
            triplet: x64-windows
            cache: sccache
          - id: windows-clang
            name: Windows Clang
            os: windows-latest
            c: clang-cl
            cxx: clang-cl
            triplet: x64-windows
            cache: sccache
          - id: windows-gcc
            name: Windows GCC
            os: windows-latest
            c: gcc
            cxx: g++
            triplet: x64-mingw-static
            cache: ccache
          - id: linux-gcc
            name: Linux GCC
            os: ubuntu-latest
            c: gcc
            cxx: g++
            triplet: x64-linux
            cache: ccache
          - id: linux-clang
            name: Linux Clang
            os: ubuntu-latest
            c: clang
            cxx: clang++
            triplet: x64-linux
            cache: ccache
          - id: macos-clang
            name: macOS Clang
            os: macos-latest
            c: clang
            cxx: clang++
            triplet: arm64-osx
            cache: ccache

    env:
      CC: ${{ matrix.toolchain.c }}
      CXX: ${{ matrix.toolchain.cxx }}
      VCPKG_ROOT: ${{ env.VCPKG_INSTALLATION_ROOT }}
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.toolchain.triplet }}
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # GLFW builds both its X11 and Wayland backends on Linux, so both sets of
      # headers have to be present or the configure step fails.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            xorg-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols \
            extra-cmake-modules

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja || true

      # cl and clang-cl both need the MSVC headers, libraries and linker on PATH.
      # The MinGW leg deliberately skips this so that it resolves its own toolchain.
      - name: Set up MSVC developer environment
        if: matrix.toolchain.id == 'windows-msvc' || matrix.toolchain.id == 'windows-clang'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install MinGW-w64 and Ninja
        if: matrix.toolchain.id == 'windows-gcc'
        run: choco install mingw ninja -y --no-progress

      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: vcpkg-cache
          key: vcpkg-${{ matrix.toolchain.id }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ matrix.toolchain.id }}-

      - name: Cache compiled objects
        uses: hendrikmuhs/ccache-action@v1
        with:
          variant: ${{ matrix.toolchain.cache }}
          key: ${{ matrix.toolchain.id }}-${{ matrix.preset }}

      - name: Configure, build and test
        run: cmake --workflow --preset ${{ matrix.preset }}

      # Only the release builds are kept. Debug binaries are large and rarely what you want to hand to someone.
      - name: Package
        if: matrix.preset == 'release'
        run: cpack --preset release

      - name: Upload application package
        if: matrix.preset == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: Combat-Tracker-${{ matrix.toolchain.id }}
          path: build/packages/*
          if-no-files-found: error
          retention-days: 14
