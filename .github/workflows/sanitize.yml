name: Sanitize

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Sanitize workflow on the latest ubuntu version using gcc/clang.
  sanitize:
    name: ${{ matrix.toolchain.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - id: linux-gcc
            name: Linux GCC
            c: gcc
            cxx: g++
          - id: linux-clang
            name: Linux Clang
            c: clang
            cxx: clang++

    env:
      CC: ${{ matrix.toolchain.c }}
      CXX: ${{ matrix.toolchain.cxx }}
      VCPKG_DEFAULT_TRIPLET: x64-linux
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Point VCPKG_ROOT at the preinstalled vcpkg
        run: echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            xorg-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols \
            extra-cmake-modules

      - name: Lower ASLR entropy for ASan
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: vcpkg-cache
          key: vcpkg-${{ matrix.toolchain.id }}-sanitize-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ matrix.toolchain.id }}-sanitize-

      - name: Cache compiled objects
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.toolchain.id }}-sanitize

      - name: Configure, build and test
        run: cmake --workflow --preset sanitize
