version: 2

updates:
  # Keeps the action versions in .github/workflows current.
  # Actions are pinned by major tag, so this is what notices when v4 becomes v5.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "vcpkg"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "deps"
